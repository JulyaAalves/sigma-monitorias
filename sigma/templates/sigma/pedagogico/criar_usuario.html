{% extends 'sigma/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-secondary"><i class="bi bi-person-plus"></i> Cadastrar Novo Usuário</h3>
    <a href="{% url 'listar_usuarios' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Voltar</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            
            <div class="row">
                {% for field in form %}
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold text-muted">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <small class="text-muted d-block mt-1">{{ field.help_text }}</small>
                    {% endif %}
                    {% for error in field.errors %}
                        <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                </div>
                {% endfor %}
            </div>

            <hr class="mt-4 mb-4">
            <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-success px-4 py-2 fs-5">Salvar Cadastro</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
